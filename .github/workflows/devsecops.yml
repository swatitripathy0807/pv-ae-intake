# DevSecOps CI/CD pipeline — PV Adverse Event Intake API
#
#   CI:  secrets ─┐
#        tests   ─┤
#        SAST    ─┼─► build image ─► image scan + SBOM ─► deploy to staging (kind) ─► DAST (ZAP)
#        SCA     ─┤                                                                    │
#        IaC     ─┘                                                                    ▼
#   CD:                         sign image (main only) ─► manual approval ─► deploy to production
#
# Every security job is a GATE: a High/Critical finding fails the run and nothing deploys.

name: devsecops-pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: pv-ae-intake
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ #
  # 1. SECRETS SCAN — hardcoded keys, tokens, passwords
  # ------------------------------------------------------------------ #
  secrets-scan:
    name: "Secrets scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks — scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --redact --verbose --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ------------------------------------------------------------------ #
  # 2. UNIT TESTS — includes security tests (auth, validation, audit trail)
  # ------------------------------------------------------------------ #
  unit-tests:
    name: "Unit & security tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest with coverage gate
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ------------------------------------------------------------------ #
  # 3. SAST — static analysis of our own code
  # ------------------------------------------------------------------ #
  sast:
    name: "SAST (Semgrep + Bandit)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload findings to the GitHub Security tab
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets \
            --error --sarif --output semgrep.sarif app
      - name: Bandit (fail on medium+ severity)
        if: always()
        run: |
          pip install bandit
          bandit -r app -ll -f txt
      - name: Upload SARIF to Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # Security tab needs a public repo or GitHub Advanced Security
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ------------------------------------------------------------------ #
  # 4. SCA — known CVEs in third-party dependencies
  # ------------------------------------------------------------------ #
  sca:
    name: "SCA (pip-audit + Trivy fs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --desc
      - name: Trivy filesystem scan (HIGH/CRITICAL)
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs /src \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1

  # ------------------------------------------------------------------ #
  # 5. IaC SCAN — Kubernetes manifests + Dockerfile misconfigurations
  # ------------------------------------------------------------------ #
  iac-scan:
    name: "IaC scan (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Checkov — Kubernetes + Dockerfile
        run: checkov -d . --framework kubernetes,dockerfile --compact

  # ------------------------------------------------------------------ #
  # 6. BUILD + CONTAINER SCAN + SBOM  (runs only if every gate passed)
  # ------------------------------------------------------------------ #
  build:
    name: "Build, scan image, SBOM"
    needs: [secrets-scan, unit-tests, sast, sca, iac-scan]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -t ${IMAGE_NAME}:${{ steps.meta.outputs.tag }} .
      - name: Trivy image scan (OS + libs, HIGH/CRITICAL, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ${IMAGE_NAME}:${{ steps.meta.outputs.tag }}
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Save image for later jobs
        run: docker save ${IMAGE_NAME}:${{ steps.meta.outputs.tag }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # ------------------------------------------------------------------ #
  # 7. DEPLOY TO STAGING (ephemeral Kubernetes) + DAST
  # ------------------------------------------------------------------ #
  staging-dast:
    name: "Deploy to staging + DAST (OWASP ZAP)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Create ephemeral Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: staging
      - name: Load image + deploy
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          docker load -i image.tar
          kind load docker-image ${IMAGE_NAME}:${TAG} --name staging
          kubectl apply -f k8s/deployment.yaml --dry-run=client -o name >/dev/null   # schema check
          # Staging uses the locally loaded tag; production uses the signed digest.
          sed "s|image: .*|image: ${IMAGE_NAME}:${TAG}|" k8s/deployment.yaml > /tmp/staging.yaml
          kubectl apply -f /tmp/staging.yaml
          kubectl -n pv create secret generic ae-intake-secrets \
            --from-literal=api-key="$(openssl rand -hex 24)" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n pv rollout status deploy/ae-intake --timeout=180s
      - name: Smoke test + authenticated OWASP ZAP API scan
        run: |
          API_KEY=$(kubectl -n pv get secret ae-intake-secrets -o jsonpath='{.data.api-key}' | base64 -d)
          echo "::add-mask::${API_KEY}"
          kubectl -n pv port-forward svc/ae-intake 8080:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 2; done

          # Security smoke tests against the real deployment
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/adverse-events \
                 -H 'Content-Type: application/json' -d '{}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/adverse-events \
                 -H "X-API-Key: ${API_KEY}" -H 'Content-Type: application/json' \
                 -d '{"patient":{"initials":"AB","sex":"F"},"reporter":{"type":"physician","country":"US"},"suspect_product":"Drug X","reaction":"Rash","seriousness":["hospitalisation"]}')" = "201"

          # DAST: ZAP crawls the OpenAPI spec and attacks every endpoint, sending the API key.
          # -I = warnings are reported but do not fail; FAIL-level alerts break the build.
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8080/openapi.json -f openapi -I \
            -r zap-report.html -J zap-report.json \
            -z "-config replacer.full_list(0).description=apikey \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=X-API-Key \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=${API_KEY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/

  # ------------------------------------------------------------------ #
  # 8. PUBLISH + SIGN (main branch only)
  # ------------------------------------------------------------------ #
  publish:
    name: "Push to registry + sign (Cosign)"
    needs: [build, staging-dast]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing with GitHub OIDC
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REF=${REGISTRY}/${OWNER}/${IMAGE_NAME}
          docker load -i image.tar
          docker tag ${IMAGE_NAME}:${TAG} ${REF}:${TAG}
          docker push ${REF}:${TAG}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${REF}:${TAG})
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${DIGEST}"
      - name: Sign image + attach SBOM attestation
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${DIGEST}"

  # ------------------------------------------------------------------ #
  # 9. DEPLOY TO PRODUCTION — manual approval via GitHub Environment
  # ------------------------------------------------------------------ #
  deploy-production:
    name: "Deploy to production (approval required)"
    needs: publish
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in Settings → Environments
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Verify signature before deploying
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign verify "${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Render production manifest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          sed "s|image: .*|image: ${DIGEST}|" k8s/deployment.yaml > prod.yaml
          grep "image:" prod.yaml
      # Replace this step with your real target, e.g. azure/k8s-deploy, aws eks
      # update-kubeconfig + kubectl apply, or an ArgoCD sync.
      - name: Deploy (demo)
        run: |
          echo "Deploying ${{ needs.publish.outputs.digest }} to production"
          echo "Approved by: ${{ github.actor }} | Run: ${{ github.run_id }} | Commit: ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: prod.yaml
